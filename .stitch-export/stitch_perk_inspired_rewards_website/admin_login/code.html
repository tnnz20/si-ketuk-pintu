<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Admin Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to manage visitor requests.</p>
</div>
</div>
<form class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address or Username</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-surface-alt rounded text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-colors" id="email" name="email" placeholder="admin@domain.gov" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline decoration-secondary" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-surface-alt rounded text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-colors" id="password" name="password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface focus:outline-none transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded font-label-md text-label-md hover:opacity-90 active:opacity-80 transition-opacity flex justify-center items-center gap-2 mt-2" type="submit">
                    Login
                    <span aria-hidden="true" class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
