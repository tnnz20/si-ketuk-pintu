name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image with Buildah (Podman)
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: frontend
          tags: |
            latest
            ${{ github.sha }}
            ${{ github.ref_name }}
          containerfiles: apps/frontend/Dockerfile
          context: apps/frontend
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8080' }}
            VITE_APP_ENV=production
            VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Push to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: |
            latest
            ${{ github.ref_name }}
          registry: ghcr.io/${{ github.repository }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Export the version tag and full image path for the session
            export VERSION_TAG=${{ github.ref_name }}
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:$VERSION_TAG

            # Pull the new Image
            podman compose -p si-ketuk-pintu pull frontend

            # Forcefully stop and remove the old container
            podman compose -p si-ketuk-pintu stop frontend
            podman compose -p si-ketuk-pintu rm -f frontend

            # Start the new container (--no-deps ensures it NEVER touches postgres)
            podman compose -p si-ketuk-pintu up -d --no-deps frontend

            # Clean up dangling images
            podman image prune -f