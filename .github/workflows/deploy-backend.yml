name: Deploy Backend

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Customize tag to deploy (e.g. v1.0.0 or latest)"
        required: false
        default: "latest"
        type: string

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}/backend"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Deploy Backend Service
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Export version tag and normalized image path for compose session
            export VERSION_TAG=${{ inputs.tag || github.ref_name }}
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE=ghcr.io/${REPO}/backend:$VERSION_TAG

            # Pull the new image
            podman compose -p si-ketuk-pintu pull backend

            # Stop and remove ONLY the backend service
            podman compose -p si-ketuk-pintu stop backend
            podman compose -p si-ketuk-pintu rm -f backend

            # Start updated backend container isolated from postgres
            podman compose -p si-ketuk-pintu up -d --no-deps backend

            # Clean up dangling images
            podman image prune -f
