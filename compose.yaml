services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy apps/backend/.env.example to apps/backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?copy apps/backend/.env.example to apps/backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy apps/backend/.env.example to apps/backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/si-ketuk-pintu/backend:latest}
    build:
      context: ./apps/backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: "0.0.0.0"
      APP_PORT: "${APP_PORT:-8080}"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Makassar}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in apps/backend/.env}
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-10}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/si-ketuk-pintu/frontend:latest}
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: