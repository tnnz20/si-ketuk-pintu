services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy apps/backend/.env.example to apps/backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?copy apps/backend/.env.example to apps/backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy apps/backend/.env.example to apps/backend/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
